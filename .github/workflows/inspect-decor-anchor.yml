name: Inspect decor anchors
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('game.js').read_text()
          for needle in ['function rebuild','s.level===0','s.level===1','LEVELS[s.level]']:
              print('\n###',needle)
              start=0
              for _ in range(6):
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-700):i+1800])
                  start=i+1
          PY
