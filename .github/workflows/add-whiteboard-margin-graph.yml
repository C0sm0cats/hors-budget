name: Add whiteboard margin graph
on:
  push:
    branches: [add-whiteboard-margin-graph]
    paths: ['.github/workflows/add-whiteboard-margin-graph.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-whiteboard-margin-graph
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="""      write('- Kévin',64,330,1.2);\n\n    });"""
          new="""      write('- Kévin',64,330,1.2);\n\n      // Petit graphe au feutre bleu : marge en hausse, salaires à plat.\n      const gx=W*.64,gy=H*.70,gw=W*.27,gh=H*.20;\n      c.save();\n      c.strokeStyle='#287aa6';c.fillStyle='#287aa6';c.lineCap='round';c.lineJoin='round';\n      c.lineWidth=Math.max(4,H*.012);\n      c.beginPath();c.moveTo(gx,gy);c.lineTo(gx,gy-gh);c.moveTo(gx,gy);c.lineTo(gx+gw,gy);c.stroke();\n      c.font='800 '+Math.max(18,H*.052)+'px system-ui';c.textAlign='left';c.textBaseline='middle';\n      c.fillText('MARGE',gx+gw*.05,gy-gh*.88);\n      c.beginPath();c.moveTo(gx+gw*.08,gy-gh*.18);c.lineTo(gx+gw*.30,gy-gh*.31);c.lineTo(gx+gw*.47,gy-gh*.45);c.lineTo(gx+gw*.68,gy-gh*.61);c.lineTo(gx+gw*.90,gy-gh*.82);c.stroke();\n      c.beginPath();c.moveTo(gx+gw*.90,gy-gh*.82);c.lineTo(gx+gw*.82,gy-gh*.80);c.moveTo(gx+gw*.90,gy-gh*.82);c.lineTo(gx+gw*.87,gy-gh*.70);c.stroke();\n      c.strokeStyle='#b05b9b';c.fillStyle='#b05b9b';c.lineWidth=Math.max(4,H*.011);\n      c.beginPath();c.moveTo(gx+gw*.08,gy-gh*.12);c.lineTo(gx+gw*.90,gy-gh*.13);c.stroke();\n      c.font='800 '+Math.max(17,H*.047)+'px system-ui';c.fillText('SALAIRES',gx+gw*.27,gy+H*.055);\n      c.restore();\n\n    });"""
          if old not in s:
              raise SystemExit('whiteboard target not found')
          p.write_text(s.replace(old,new,1))
          i=Path('index.html')
          h=i.read_text()
          if 'game.js?v=31' not in h:
              raise SystemExit('game cache version not found')
          i.write_text(h.replace('game.js?v=31','game.js?v=32',1))
          PY
          node --check game.js
          git rm .github/workflows/add-whiteboard-margin-graph.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js index.html
          git commit -m "Draw margin versus salary graph on Kevin whiteboard"
          git push
