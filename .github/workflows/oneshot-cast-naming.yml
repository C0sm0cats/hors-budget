name: one-shot canonical cast migration
on:
  push:
    branches: [canonical-cast-naming]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-cast-naming
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canonicalize cast keys and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          replacements=[
            ("const CAST={kevin:","const CAST={keke:"),
            (",charline:{",",chacha:{"),
            ("kind==='kevin'","kind==='keke'"),
            ("kind==='charline'","kind==='chacha'"),
            ("person(moving,'kevin'","person(moving,'keke'"),
            ("person(moving,'charline'","person(moving,'chacha'"),
            ("CAST.kevin","CAST.keke"),
            ("CAST.charline","CAST.chacha"),
            ("charlineIn","chachaIn"),
            ("charlineX","chachaX"),
            ("kevinX","kekeX"),
          ]
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new)
          assert "const CAST={keke:" in s
          assert ",chacha:{" in s
          assert "kind==='kevin'" not in s
          assert "kind==='charline'" not in s
          assert "charlineIn" not in s
          assert "charlineX" not in s
          assert "kevinX" not in s
          assert "person(moving,'keke'" in s
          assert "person(moving,'chacha'" in s
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          assert 'game.js?v=44' in h
          i.write_text(h.replace('game.js?v=44','game.js?v=45',1))
          for name in ['tests/cache-version.test.cjs','tests/redesign-invariants.test.cjs','tests/storage-migration.test.cjs']:
              t=Path(name)
              x=t.read_text()
              if 'game.js?v=44' in x:
                  x=x.replace('game.js?v=44','game.js?v=45')
                  t.write_text(x)
          Path('tests/cast-naming.test.cjs').write_text("""const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst game=fs.readFileSync('game.js','utf8');\nconst index=fs.readFileSync('index.html','utf8');\ntest('canonical runtime cast keys use KÉKÉ and CHACHA naming',()=>{\n  assert.match(game,/const CAST=\\{keke:/);\n  assert.match(game,/,chacha:\\{/);\n  assert.doesNotMatch(game,/CAST=\\{kevin:/);\n  assert.doesNotMatch(game,/kind==='kevin'/);\n  assert.doesNotMatch(game,/kind==='charline'/);\n  assert.doesNotMatch(game,/charlineIn|charlineX|kevinX/);\n  assert.match(game,/person\\(moving,'keke'/);\n  assert.match(game,/person\\(moving,'chacha'/);\n  assert.match(index,/game\\.js\\?v=45/);\n  assert.match(game,/LEGACY_STORAGE='mutine\\.kevin\\.arcade\\.v3'/);\n});\n""")
          PY
          npm test
      - name: Commit canonical naming
        run: |
          rm .github/workflows/oneshot-cast-naming.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js index.html tests/cache-version.test.cjs tests/redesign-invariants.test.cjs tests/storage-migration.test.cjs tests/cast-naming.test.cjs .github/workflows/oneshot-cast-naming.yml
          git commit -m "Use canonical KÉKÉ and CHACHA runtime keys"
          git push origin HEAD:canonical-cast-naming
