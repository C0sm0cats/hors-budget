name: fix-unique-npc-quips
on:
  push:
    branches: [fix-unique-npc-quips-freeze]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-unique-npc-quips-freeze
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch renderer and tests
        run: node scripts/fix-unique-npc-quips.cjs
      - name: Commit generated fix
        run: |
          git add game.js index.html tests/smoke.spec.js tests/redesign-invariants.test.cjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix unique NPC ambient quip renderer"
          git push origin HEAD:fix-unique-npc-quips-freeze
