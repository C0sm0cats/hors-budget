name: Remove legacy MUTINE panel
on:
  push:
    branches: [remove-inetum-worldmark]
    paths: ['.github/workflows/remove-mutine-panel.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-inetum-worldmark
      - name: Remove legacy MUTINE panel and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="panel('MUTINE',-4,13.6,6.6,.8,'#243e56','#d4ed98');"
          if old not in s:
              raise SystemExit('legacy MUTINE panel not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          old='<script src="game.js?v=20"></script>'
          if old not in s:
              raise SystemExit('game.js cache tag not found')
          s=s.replace(old,'<script src="game.js?v=21"></script>',1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/remove-mutine-panel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html .github/workflows/remove-mutine-panel.yml
          git commit -m 'Remove legacy MUTINE panel'
          git push