name: Narrow Kevin whiteboard

on:
  push:
    branches: [narrow-kevin-whiteboard]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: narrow-kevin-whiteboard
      - name: Narrow whiteboard and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text()
          old = "const x=2,y=4.65,w=4.1,h=1.7;"
          new = "const x=2,y=4.65,w=3.5,h=1.7;"
          if old not in s:
              raise SystemExit('whiteboard width marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('index.html')
          s = p.read_text()
          old = '<script src="game.js?v=19"></script>'
          new = '<script src="game.js?v=20"></script>'
          if old not in s:
              raise SystemExit('game.js cache marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/narrow-whiteboard.yml
      - name: Commit targeted change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html .github/workflows/narrow-whiteboard.yml
          git commit -m "Narrow Kevin vacation whiteboard"
          git push origin HEAD:narrow-kevin-whiteboard
