name: Anonymize cast identities

on:
  push:
    branches:
      - anonymize-character-identities

permissions:
  contents: write

jobs:
  anonymize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/anonymize-cast.py
      - run: npm test
      - name: Commit anonymized repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Anonymize character identities across the game'
            git push origin HEAD:anonymize-character-identities
          fi
