name: Fix Inetum decor depth
on:
  push:
    branches: [fix-inetum-decor-depth]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-inetum-decor-depth
      - name: Patch decor into WebGL scene
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="""const BACKGROUND_SIGNS=[
           {positions:[[-6,4.8],[-1,7.8],[5,10.8]],texts:['CRA À VALIDER','OPEN SPACE'],bg:'#36515b',fg:'#bfd3d3',border:'#6b858b'},
           {positions:[[-6,4.8],[0,7.8],[5.5,10.8]],texts:['KPI · COMEX','OBJECTIF 140 %'],bg:'#312c43',fg:'#f0cf83',border:'#977b73'},
           {positions:[[-6,4.8],[0,7.8],[5.5,10.8]],texts:['SÉMINAIRE','BUDGET 2027'],bg:'#f0d39b',fg:'#7b4540',border:'#ba8271'}
          ];"""
          new="""const INETUM_DECOR=[
           [
            {x:-7.2,y:1.45,w:5.1,h:.72,title:'INETUM LCP7',sub:'LA CHAPELLE SUR ERDRE',accent:'#d6f382',a:'#153247',b:'#274f60',kind:'site'},
            {x:-6.4,y:4.45,w:3.2,h:.68,title:'ORDRE DE MISSION',sub:'AFFECTATION · CLIENT',accent:'#8fd7e8',a:'#173247',b:'#24566d'},
            {x:-1.6,y:4.45,w:2.8,h:.68,title:'COOPTATION',sub:'RECOMMANDEZ UN TALENT',accent:'#f1c75b',a:'#29384a',b:'#465468'},
            {x:5.1,y:4.45,w:2.7,h:.68,title:'SWILE',sub:'AVANTAGES SALARIÉS',accent:'#f59bbd',a:'#352d49',b:'#4e3f64'},
            {x:-6.2,y:7.45,w:3.25,h:.68,title:'SUCCESS FACTORS',sub:'OBJECTIFS · CARRIÈRE',accent:'#d6f382',a:'#203b3e',b:'#33575a'},
            {x:-1.6,y:7.45,w:3.15,h:.68,title:'MYPEOPLEDOC',sub:'DOCUMENTS RH',accent:'#8fd7e8',a:'#26394f',b:'#355b76'},
            {x:5.15,y:7.45,w:3.05,h:.68,title:'CHRONOTIME 2',sub:'TEMPS · ABSENCES',accent:'#f1c75b',a:'#3a3445',b:'#584a62'},
            {x:-6.2,y:10.42,w:2.95,h:.68,title:'SAP CONCUR',sub:'NOTES DE FRAIS',accent:'#8fd7e8',a:'#24394c',b:'#335b72'},
            {x:-1.45,y:10.42,w:3.65,h:.68,title:'LEARNING ACADEMY',sub:'FORMATIONS · CERTIFICATIONS',accent:'#d6f382',a:'#243f3a',b:'#3b5d52'},
            {x:5.25,y:10.42,w:2.55,h:.68,title:'GCOMP',sub:'CV',accent:'#f59bbd',a:'#3d2e43',b:'#59435d'}
           ],
           [
            {x:0,y:7.25,w:8.8,h:1.18,title:'POWER UP',sub:'RÉACTIVONS NOTRE PUISSANCE COLLECTIVE POUR FAIRE DE LA FRANCE LE MOTEUR DE CROISSANCE DU GROUPE',accent:'#d6f382',a:'#142b41',b:'#285269',kind:'hero'},
            {x:-6.2,y:10.42,w:3.5,h:.72,title:\"LET'S CONNECT FRANCE\",sub:'COMMUNAUTÉ · ÉCHANGES',accent:'#f1c75b',a:'#3b3142',b:'#5a4858'},
            {x:0,y:10.42,w:3.55,h:.72,title:'DO YOU SPEAK GEN AI?',sub:'IA · ACCULTURATION',accent:'#8fd7e8',a:'#23364e',b:'#315c79'},
            {x:6.05,y:10.42,w:4.15,h:.72,title:'GLOBAL SERVICE CENTER',sub:'01 78 91 96 51',accent:'#f59bbd',a:'#3d2f42',b:'#60465c'}
           ],
           [
            {x:-5.8,y:7.45,z:-1.18,w:3.9,h:.94,title:'CHARITY DAY',sub:'ENSEMBLE · SOLIDAIRES',accent:'#d6f382',a:'#24433f',b:'#3d6559',kind:'event'},
            {x:1.3,y:7.45,z:-1.18,w:5.4,h:.94,title:'SUMMER PARTY',sub:'LE POWER UP TOUR',accent:'#f5b75d',a:'#55364d',b:'#80536b',kind:'event'}
           ]
          ];"""
          if old not in s: raise SystemExit('BACKGROUND_SIGNS block not found')
          s=s.replace(old,new,1)
          old2="""  // Signs belong to the back wall, so depth testing hides them behind actors and props.
          // Append after the existing actor sign to preserve the legacy cleanup draw order.
          const background=BACKGROUND_SIGNS[level];
          for(const [i,[x,y]] of background.positions.entries()){
            sign(x,y,-1.32,2.5,.48,(c,w,h)=>{
              c.fillStyle=background.bg;c.fillRect(0,0,w,h);
              c.strokeStyle=background.border;c.lineWidth=8;c.strokeRect(4,4,w-8,h-8);
              c.fillStyle=background.fg;c.font='900 '+h*.4+'px system-ui';c.textAlign='center';c.textBaseline='middle';
              c.fillText(background.texts[i%background.texts.length],w/2,h/2,w*.9);
            });
          }"""
          new2="""  // Inetum internal-life decor is rendered as actual textured geometry in the 3D scene.
          // Depth testing therefore keeps actors, ladders and props correctly in front of the wall signage.
          const fitLines=(c,text,maxWidth,maxLines)=>{
            const words=text.split(' '),lines=[];let line='';
            for(const word of words){const test=line?line+' '+word:word;if(c.measureText(test).width<=maxWidth||!line)line=test;else{lines.push(line);line=word;if(lines.length===maxLines-1)break;}}
            if(line&&lines.length<maxLines)lines.push(line);return lines;
          };
          for(const d of INETUM_DECOR[level]){
            const z=d.z??-1.32;
            world.box(d.x,d.y,z-.055,d.w+.14,d.h+.14,.09,d.kind==='event'?'#62475a':'#162b3a');
            sign(d.x,d.y,z,d.w,d.h,(c,w,h)=>{
              const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,d.a);g.addColorStop(1,d.b);c.fillStyle=g;c.fillRect(0,0,w,h);
              c.fillStyle=d.accent;c.fillRect(0,0,Math.max(12,w*.018),h);
              c.globalAlpha=.11;c.fillStyle='#fff';c.beginPath();c.arc(w*.88,h*.15,h*.55,0,Math.PI*2);c.fill();c.globalAlpha=1;
              c.strokeStyle='#d9edf02e';c.lineWidth=Math.max(3,h*.018);c.strokeRect(3,3,w-6,h-6);
              c.textAlign='left';c.textBaseline='middle';
              const tag=d.kind==='event'?'INETUM · ÉVÉNEMENT':d.kind==='site'?'INETUM · SITE':'INETUM · INTERNE';
              c.fillStyle='#d6e4e6';c.font='800 '+Math.max(16,h*.105)+'px system-ui';c.fillText(tag,w*.07,h*.17,w*.76);
              const titleSize=d.kind==='hero'?h*.27:h*.30;c.fillStyle='#fff7df';c.font='900 '+titleSize+'px system-ui';c.fillText(d.title,w*.07,d.kind==='hero'?h*.43:h*.48,w*.85);
              const subSize=d.kind==='hero'?h*.105:h*.135,font='800 '+subSize+'px system-ui';c.fillStyle=d.accent;c.font=font;
              const ls=fitLines(c,d.sub,w*.82,d.kind==='hero'?3:2),base=d.kind==='hero'?h*.66:h*.77,step=d.kind==='hero'?h*.13:h*.15;
              ls.forEach((line,i)=>c.fillText(line,w*.07,base+i*step,w*.84));
              c.fillStyle=d.accent;c.beginPath();c.arc(w*.93,h*.2,Math.max(4,h*.035),0,Math.PI*2);c.fill();
            });
          }"""
          if old2 not in s: raise SystemExit('background render block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          i=Path('index.html');t=i.read_text()
          if '<script src="inetum-decor.js?v=1"></script>\n' not in t: raise SystemExit('inetum decor include not found')
          t=t.replace('<script src="inetum-decor.js?v=1"></script>\n','',1)
          if 'game.js?v=21' not in t: raise SystemExit('game cache tag not found')
          i.write_text(t.replace('game.js?v=21','game.js?v=22',1))
          Path('inetum-decor.js').unlink()
          Path('.github/workflows/fix-inetum-depth.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render Inetum decor behind actors in WebGL"
          git push
