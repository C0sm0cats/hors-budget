name: Fix Kevin foreground depth
on:
  push:
    branches: [fix-kevin-foreground]
jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="person(moving,'kevin',kevinX,celebrationY,.8,{"
          new="person(moving,'kevin',kevinX,celebrationY,1.55,{"
          if s.count(old)!=1:
              raise SystemExit(f'unexpected Kevin render match count: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          i=Path('index.html')
          h=i.read_text()
          if 'game.js?v=29' not in h:
              raise SystemExit('game cache version unexpected')
          i.write_text(h.replace('game.js?v=29','game.js?v=30',1))
          PY
          node --check game.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js index.html
          git rm .github/workflows/fix-kevin-foreground.yml
          git commit -m "Keep Kevin in front of floor geometry"
          git push
