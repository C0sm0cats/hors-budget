name: Remove level 2 wall chart
on:
  push:
    branches: [remove-level2-chart]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove chart everywhere in level 2
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="for(let floor=0;floor<4;floor++){const y=surface(floor,4.5);world.box(4.5,y+1.4,-1.2,2.8,1.25,.1,'#192c42');for(let i=0;i<5;i++)world.box(3.55+i*.44,y+1.02+i*.1,-1.11,.25,.2+i*.2,.04,'#d2b768');}"
          if old not in s:
              raise SystemExit('Level 2 chart block not found')
          s=s.replace(old,'',1)
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          if 'game.js?v=25' not in h:
              raise SystemExit('Expected game.js?v=25 not found')
          i.write_text(h.replace('game.js?v=25','game.js?v=26',1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/remove-level2-chart.yml
          git add game.js index.html
          git commit -m "Remove level 2 wall charts"
          git push
