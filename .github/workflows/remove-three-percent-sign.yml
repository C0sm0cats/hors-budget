name: Remove obsolete three percent sign
on:
  push:
    branches: [remove-three-percent-sign]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-three-percent-sign
      - name: Remove sign
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="const placard=sign(0,0,0,.86,.34,(c,w,h)=>{c.fillStyle='#f5e6c5';c.fillRect(0,0,w,h);c.fillStyle='#754246';c.font='900 '+h*.72+'px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('+3 %',w/2,h*.53);});placard.actor='basile';"
          if old not in s: raise SystemExit('three percent placard not found')
          p.write_text(s.replace(old,'',1))
          i=Path('index.html');t=i.read_text()
          if 'game.js?v=22' not in t: raise SystemExit('game cache tag not found')
          i.write_text(t.replace('game.js?v=22','game.js?v=23',1))
          Path('.github/workflows/remove-three-percent-sign.yml').unlink()
          PY
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete three percent placard"
          git push
