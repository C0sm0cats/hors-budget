name: Apply storage key migration
on:
  push:
    branches: [storage-key-migration]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update runtime and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="const STORAGE='hors-budget.arcade.v1',LEGACY_STORAGE='mutine.kevin.arcade.v3';\nlet career={times:[null,null,null],medals:[null,null,null],challenges:[]},record=0,canSave=true,sound=true,audioContext=null,renderer=null,victoryTimer=null;\ntry{const stored=localStorage.getItem(STORAGE),legacy=localStorage.getItem(LEGACY_STORAGE),raw=stored||legacy,saved=JSON.parse(raw||'null');if(!stored&&legacy)localStorage.setItem(STORAGE,legacy);"
          new="const STORAGE='hors-budget.arcade.v1',LEGACY_STORAGE='mutine.kevin.arcade.v3';\nlet career={times:[null,null,null],medals:[null,null,null],challenges:[]},record=0,canSave=true,sound=true,audioContext=null,renderer=null,victoryTimer=null;\ntry{const stored=localStorage.getItem(STORAGE),legacy=stored===null?localStorage.getItem(LEGACY_STORAGE):null,raw=stored??legacy,saved=JSON.parse(raw??'null');if(stored===null&&legacy!==null){localStorage.setItem(STORAGE,legacy);localStorage.removeItem(LEGACY_STORAGE);}"
          if old not in s: raise SystemExit('storage bootstrap pattern not found')
          p.write_text(s.replace(old,new,1))
          p=Path('index.html'); s=p.read_text()
          if 'game.js?v=44' not in s: raise SystemExit('game cache version not found')
          p.write_text(s.replace('game.js?v=44','game.js?v=45',1))
          for name in ['tests/cache-version.test.cjs','tests/redesign-invariants.test.cjs']:
            p=Path(name); s=p.read_text(); p.write_text(s.replace('game.js?v=44','game.js?v=45'))
          Path('tests/storage-migration.test.cjs').write_text("""const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst game=fs.readFileSync('game.js','utf8');\ntest('migrates legacy storage once without changing the canonical key',()=>{\n  assert.match(game,/const STORAGE='hors-budget\\.arcade\\.v1',LEGACY_STORAGE='mutine\\.kevin\\.arcade\\.v3'/);\n  assert.match(game,/legacy=stored===null\?localStorage\\.getItem\\(LEGACY_STORAGE\\):null/);\n  assert.match(game,/localStorage\\.setItem\\(STORAGE,legacy\\)/);\n  assert.match(game,/localStorage\\.removeItem\\(LEGACY_STORAGE\\)/);\n});\n""")
          Path('.github/workflows/tmp-storage-migration.yml').unlink()
          PY
          npm test
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish legacy local storage migration"
          git push
