name: Fix Basile sign remnant
on:
  push:
    branches: [fix-basile-sign-remnant]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Basile union render blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('game.js').read_text()
          needle="e.type==='union'"
          pos=[]; start=0
          while True:
              i=s.find(needle,start)
              if i<0: break
              pos.append(i); start=i+1
          print('POSITIONS',pos)
          for i in pos:
              print('\n---',i,'---\n')
              print(s[max(0,i-350):i+650])
          raise SystemExit('inspection complete')
          PY
