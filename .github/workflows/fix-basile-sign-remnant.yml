name: Fix Basile sign remnant
on:
  push:
    branches: [fix-basile-sign-remnant]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Basile union render block
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('game.js').read_text()
          needle="e.type==='union'"
          i=s.find(needle)
          print('INDEX',i)
          print(s[max(0,i-500):i+900])
          if i<0: raise SystemExit('union block not found')
          raise SystemExit('inspection complete')
          PY
