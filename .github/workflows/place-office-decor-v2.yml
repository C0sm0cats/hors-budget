name: Place office decor v2
on:
  push:
    branches: [place-office-decor-v2]
jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "$(echo  | base64 -d)"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js index.html
          git rm .github/workflows/place-office-decor-v2.yml
          git commit -m "Reposition office decor and add babyfoot sign"
          git push
