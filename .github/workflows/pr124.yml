name: pr124-roro-safe
on:
  push:
    branches: [integrate-roro-safe-native]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-roro-safe-native
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pr124.cjs
      - run: npm test
      - name: Commit generated cleanup
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate RORO safe into polish" || exit 0
          git push origin HEAD:integrate-roro-safe-native
