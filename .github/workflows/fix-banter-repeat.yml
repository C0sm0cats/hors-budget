name: Fix banter repeat
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve punchline history across state resets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('banter-fair.js')
          s=p.read_text()
          old="function reset(now){for(const b of bubbles.values()){b.el.hidden=true;b.until=0;b.next=now+1800+Math.random()*3500;b.last=-1;b.lastShown=-Math.random()*5000;}}"
          new="function reset(now){for(const b of bubbles.values()){b.el.hidden=true;b.until=0;b.next=now+1800+Math.random()*3500;b.lastShown=-Math.random()*5000;}}"
          assert old in s, 'reset pattern not found'
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          assert 'banter-fair.js?v=4' in s, 'cache version not found'
          p.write_text(s.replace('banter-fair.js?v=4','banter-fair.js?v=5',1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-banter-repeat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add banter-fair.js index.html .github/workflows/fix-banter-repeat.yml
          git commit -m "Preserve banter history across state resets"
          git push
