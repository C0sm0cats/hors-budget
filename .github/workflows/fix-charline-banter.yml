name: Fix Charline banter
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-charline-banter-visibility
      - name: Patch Charline visibility gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('banter-fair.js')
          s=p.read_text()
          old="    if(p.floor>=3&&s.princess){\n      const pos=renderer.project(s.princess.x,s.princess.y+2.35,.4);if(onscreen(pos))candidates.push({id:'charline',cls:'charline',pool:pools.charline,pos});\n    }"
          new="    if(s.princess){\n      const pos=renderer.project(s.princess.x,s.princess.y+2.35,.4);if(onscreen(pos))candidates.push({id:'charline',cls:'charline',pool:pools.charline,pos});\n    }"
          assert old in s, 'Charline gate not found'
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          assert 'banter-fair.js?v=3' in s, 'cache version not found'
          p.write_text(s.replace('banter-fair.js?v=3','banter-fair.js?v=4',1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/fix-charline-banter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add banter-fair.js index.html .github/workflows/fix-charline-banter.yml
          git commit -m "Fix Charline banter visibility"
          git push origin HEAD:fix-charline-banter-visibility